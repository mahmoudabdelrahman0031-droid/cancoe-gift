<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cancoé — Gift</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Poppins:wght@400;500;600&family=Jost:wght@400;500;600&display=swap');

  :root{
    --ink:#4A3D37;
    --ink-deep:#332821;
    --pink-bg:#F6E1F1;
    --pink-soft:#FCF1FB;
    --bronze:#8B5A3C;
    --bronze-deep:#4F3018;
    --copper:#A97C52;
    --blush:#F0C9E3;
    --error:#B3453D;
    --shadow:0 20px 50px rgba(74,61,55,0.18);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--pink-bg);
    color:var(--ink);
    font-family:'Poppins', sans-serif;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    height:100vh;
    overflow-y:scroll;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  .eyebrow{
    font-family:'Jost', sans-serif;
    font-size:11px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--bronze);
    font-weight:600;
  }

  .section{
